<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Services Dashboard</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <h1>Services Dashboard</h1>
      <p id="generated" class="muted"></p>
    </div>
    <form id="search-form" role="search">
      <label for="q" class="visually-hidden">Search</label>
      <input id="q" type="search" placeholder="Search everything, e.g. Joe Smith   (press / to focus)" autocomplete="off" autofocus>
    </form>
    <div id="filters" class="filters" role="group" aria-label="Search in"></div>
  </header>

  <main class="layout">
    <section class="list" aria-label="Results">
      <p id="summary" class="muted" aria-live="polite"></p>
      <ol id="results" class="results"></ol>
    </section>
    <section id="detail" class="detail" aria-label="Selected item"></section>
  </main>

  <!-- data.js is generated by scripts/build-dashboard-data.ps1 from dataExports/. -->
  <script src="data.js"></script>
  <script src="markdown.js"></script>
  <script src="app.js"></script>
</body>
</html>
